<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Student Command Center</title>
  <desc id="d">Your semester, under control: subjects, tasks, notes, focus timer, analytics and an AI study assistant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <style>
    .orb-a { animation: drift-a 14s ease-in-out infinite alternate; }
    .orb-b { animation: drift-b 18s ease-in-out infinite alternate; }
    .sheen { animation: sweep 7s ease-in-out infinite; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 1010px 160px; }
    .ring { animation: spin 24s linear infinite; transform-origin: 1010px 160px; }
    .title { font: 800 56px/1 -apple-system, "Segoe UI", "Plus Jakarta Sans", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: -1.5px; }
    .tag { font: 600 26px/1 -apple-system, "Segoe UI", Inter, Roboto, Arial, sans-serif; }
    .sub { font: 400 18px/1 -apple-system, "Segoe UI", Inter, Roboto, Arial, sans-serif; }
    .chip { font: 600 13px/1 -apple-system, "Segoe UI", Inter, Roboto, Arial, sans-serif; letter-spacing: .4px; }
    @keyframes drift-a { from { transform: translate(0,0); } to { transform: translate(120px,40px); } }
    @keyframes drift-b { from { transform: translate(0,0); } to { transform: translate(-140px,-30px); } }
    @keyframes sweep { 0% { transform: translateX(-700px); } 60%,100% { transform: translateX(1300px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .orb-a, .orb-b, .sheen, .pulse, .ring { animation: none; }
      .rise { animation: none; opacity: 1; }
      .sheen { display: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="orb-a" cx="260" cy="40" r="260" fill="url(#orbA)"/>
    <circle class="orb-b" cx="980" cy="300" r="240" fill="url(#orbB)"/>
    <rect class="sheen" x="0" y="0" width="420" height="320" fill="url(#sheen)" transform="skewX(-20)"/>

    <!-- logo mark -->
    <g class="rise">
      <rect x="64" y="56" width="44" height="44" rx="12" fill="#8b5cf6"/>
      <text x="86" y="85" text-anchor="middle" class="chip" fill="#fff" style="font-size:17px">SC</text>
      <text x="122" y="84" class="chip" fill="#e0e7ff" style="font-size:16px;letter-spacing:.2px">Command Center</text>
    </g>

    <text x="64" y="166" class="title rise d1" fill="#ffffff">Student Command Center</text>
    <text x="64" y="210" class="tag rise d2" fill="url(#accent)" filter="url(#glow)">Your semester, under control.</text>
    <text x="64" y="248" class="sub rise d3" fill="#c7d2fe">Subjects · Tasks · Notes · Focus timer · Analytics · AI study assistant</text>

    <g class="rise d4">
      <rect x="64" y="268" width="92" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
      <text x="110" y="285" text-anchor="middle" class="chip" fill="#e0e7ff">Vite SPA</text>
      <rect x="164" y="268" width="92" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
      <text x="210" y="285" text-anchor="middle" class="chip" fill="#e0e7ff">FastAPI</text>
      <rect x="264" y="268" width="108" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
      <text x="318" y="285" text-anchor="middle" class="chip" fill="#e0e7ff">PostgreSQL</text>
    </g>

    <!-- focus timer motif -->
    <g class="pulse">
      <circle cx="1010" cy="160" r="88" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    </g>
    <g class="ring">
      <circle cx="1010" cy="160" r="70" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="300 140"/>
    </g>
    <text x="1010" y="170" text-anchor="middle" class="tag" fill="#ffffff" style="font-size:30px">25:00</text>
    <text x="1010" y="196" text-anchor="middle" class="chip" fill="#c7d2fe" style="font-size:11px;letter-spacing:2px">FOCUS</text>
  </g>
</svg>

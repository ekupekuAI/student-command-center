# Alembic configuration for Student Command Center backend.
# The database URL is NOT set here — alembic/env.py reads it from
# DATABASE_URL (backend/.env) so credentials stay out of version control.

[alembic]
script_location = alembic
prepend_sys_path = .

# Other config values (logging) below.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S